        options: ["לבנות עוד חניונים על החוף", "לשקם את נהר הירקון", "לזרוק פסולת לים"], correct: 1, hint: "מה מתקן מחיר שהסביבה שילמה?" }
    ]
  },
  {
    title: "התוצר שלי: העיר שלי בעולם משתנה",
    guess: { q: "נחשו: איזה חלק מהאנשים בעולם גר היום בערים?", options: ["בערך 2 מתוך 10", "קצת יותר מחצי", "9 מתוך 10"], correct: 1, reveal: "קצת יותר מחצי! לפי האו\"ם, ב-1950 רק בערך שליש מהאנשים גרו בערים. היום כבר יותר מחצי. העולם באמת משתנה, וגם אתם חלק מזה." },
    explain: `<p>זה הצעד האחרון במסלול. עכשיו אתם מחברים את כל מה שלמדתם.</p>
      <p>כתבו 3–4 משפטים על תל אביב-יפו כעיר בעולם משתנה. השתמשו בלפחות 2 מושגים מהרשימה, ותנו דוגמה אחת מהעיר.</p>
      <div class="chips">${CONCEPTS.map(c => `<span class="chip">${c}</span>`).join("")}</div>
      <p class="starters">אפשר להתחיל כך: "פעם, במקום שבו... היום יש..." / "השינוי הזה קרה מהר כי..." / "המחיר של השינוי הוא..." / "כדי לתקן, אפשר..."</p>`,
    task: { prompt: "כתבו כאן את 3–4 המשפטים שלכם:", min: 80, big: true },
    deep: "קראו את מה שכתבתם. איזה משפט שלכם הכי קשה להוכיח? מה הייתם צריכים לבדוק כדי לדעת שהוא נכון?",
    scaffold: "בחרו מושג אחד שהשתמשתם בו, והסבירו אותו במילים שלכם במשפט אחד.",
    check: [
      { type: "selfcheck", q: "לפני שממשיכים, בדקו את עצמכם:",
        items: ["השתמשתי בלפחות 2 מושגים מהרשימה", "נתתי דוגמה אחת מתל אביב-יפו", "כתבתי על מחיר של שינוי או על אחריות"] }
    ]
  }
];

const CHALLENGES = [
  { title: "אתגר 1: תל אביב-יפו ב-2050", prompt: "איך תיראה העיר ב-2050? תארו שני שינויים שלדעתכם יקרו, ולכל אחד מהם יתרון ומחיר." },
  { title: "אתגר 2: מי מרוויח ומי משלם?", prompt: "כשמשכונה משתנה (בניינים חדשים, מחירים עולים, אנשים חדשים מגיעים), יש מי שמרוויח ויש מי שמשלם. תנו דוגמה לכל צד. נסו לחשוב גם על מבוגרים, על משפחות ועל בעלי עסקים." }
];

let state = load() || fresh();
state.level = state.level || {}; state.adapt = state.adapt || {}; state.guess = state.guess || {}; state.games = state.games || {};
function fresh() { return { screen: "start", step: 0, answers: {}, attempts: {}, solved: {}, times: {}, challenges: {}, level: {}, adapt: {}, guess: {}, games: {}, started: null }; }
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

let stepStart = Date.now();
function addTime() {
  if (state.screen !== "step") return;
  const k = state.step;
  state.times[k] = (state.times[k] || 0) + Math.round((Date.now() - stepStart) / 1000);
  stepStart = Date.now();
}
window.addEventListener("beforeunload", () => { addTime(); save(); });

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function header(name, frac) {
  document.getElementById("stepname").textContent = name;
  document.getElementById("bar").style.width = Math.round(frac * 100) + "%";
}

function render() {
  save();
  window.scrollTo(0, 0);
  if (state.screen === "start") return renderStart();
  if (state.screen === "step") return renderStep();
  if (state.screen === "challenge") return renderChallenges();
  if (state.screen === "finish") return renderFinish();
  if (state.screen === "exit") return renderExit();
}

document.getElementById("navhome").onclick = () => { addTime(); state.screen = "start"; render(); };
document.getElementById("navreload").onclick = () => { addTime(); save(); location.reload(); };
document.getElementById("navsend").onclick = () => {
  if (!state.started) { alert("עוד לא התחלתם לעבוד. לחצו \"התחילו את הצעד הראשון\"."); return; }
  addTime(); save();
  const subject = isDone() ? "גיאוגרפיה ז6 – העולם משתנה" : `גיאוגרפיה ז6 – עבודה חלקית (צעד ${state.step + 1} מתוך ${STEPS.length})`;
  window.open(gmailUrl(subject, summary()), "_blank", "noopener");
};

function renderExit() {
  header("יצאתם מהמסלול", 0);
  app.innerHTML = `<h1>העבודה שלכם שמורה</h1>
    <div class="card explain"><span class="tag">יציאה</span>
      <p>אפשר לסגור את הלשונית. כשתחזרו לקישור במחשב הזה, תוכלו להמשיך מאותו מקום.</p></div>
    <button class="primary" id="backin" type="button">חזרה לעמוד הראשון</button>`;
  document.getElementById("backin").onclick = () => { state.screen = "start"; render(); };
  try { window.close(); } catch (e) {}
}

function renderStart() {
  header("לפני שמתחילים", 0);
  const resume = !!state.started;
  app.innerHTML = `
    <h1>העולם משתנה, ותל אביב-יפו איתו</h1>
    <div class="card explain"><span class="tag">איך זה עובד</span>
      <p>יש כאן <b>6 צעדים</b>. כל אחד עובד לבד, בקצב שלו.</p>
      <p>כל צעד נפתח בחידה או בניחוש. אין ציון על הניחוש, אז תנחשו באומץ.</p>
      <p>בכל צעד: קוראים הסבר קצר, עושים משימה, ועונים על בדיקה קצרה. ממשיכים רק אחרי שהבדיקה מצליחה. מותר לטעות ולנסות שוב.</p>
      <p>אחרי כל בדיקה מגיעה שאלת חשיבה. מי שעונה נכון כבר בניסיון הראשון יקבל שאלת עומק קשה יותר.</p>
      <p>בסוף שולחים לאסף במייל את מה שעשיתם. מי שמסיים מוקדם יכול לנסות צעדי אתגר.</p>
    </div>
    ${resume ? `<div class="card task"><span class="tag">יש התקדמות שמורה</span>
        <p>במחשב הזה כבר יש עבודה שהתחילה (צעד ${state.step + 1}). אם זו העבודה שלכם, המשיכו. אם לא, התחילו מחדש.</p>
        <div class="row"><button class="primary" id="resume">המשיכו מצעד ${state.step + 1}</button>
        <button class="ghost" id="restart">התחילו מחדש</button></div></div>`
      : `<button class="primary" id="go">התחילו את הצעד הראשון</button>`}
    <div class="row" style="margin-top:12px">
      <button type="button" class="ghost" id="startreload">↻ רענון הדף</button>
      <button type="button" class="ghost" id="startexit">יציאה ושמירה</button>
    </div>
  `;
  document.getElementById("startreload").onclick = () => { save(); location.reload(); };
  document.getElementById("startexit").onclick = () => { state.screen = "exit"; render(); };
  if (resume) {
    document.getElementById("resume").onclick = () => { state.screen = "step"; stepStart = Date.now(); render(); };
    document.getElementById("restart").onclick = () => { state = fresh(); render(); };
  } else {
    document.getElementById("go").onclick = () => { state.started = new Date().toISOString(); state.screen = "step"; state.step = 0; stepStart = Date.now(); render(); };
  }
}

function renderStep() {
  const i = state.step, s = STEPS[i];
  header(`צעד ${i + 1} מתוך ${STEPS.length}: ${s.title}`, i / STEPS.length);
  let html = `<h1>${esc(s.title)}</h1>`;
  if (s.guess) {
    const g = s.guess, got = state.guess[i];
    html += `<div class="card game"><span class="tag">חידה</span><div class="qt" style="font-weight:600;margin-bottom:8px">${esc(g.q)}</div>
      <div class="opts" id="guessopts">${g.options.map((o, oi) => `<button type="button" data-oi="${oi}" class="${got !== undefined && oi === g.correct ? "right" : got === oi ? "wrong" : ""}">${esc(o)}</button>`).join("")}</div>
      ${got !== undefined ? `<div class="reveal">${got === g.correct ? "ניחשתם נכון! " : ""}${esc(g.reveal)}</div>` : ""}</div>`;
  }
  const locked = s.guess && state.guess[i] === undefined;
  html += `<div id="rest" class="${locked ? "hidden" : ""}"><div class="card explain"><span class="tag">הסבר</span>${s.explain}</div>`;
  if (s.task) {
    html += `<div class="card task"><span class="tag">משימה</span>
      <label class="lbl" for="task">${esc(s.task.prompt)}</label>
      <textarea id="task" ${s.task.big ? 'style="min-height:180px"' : ""}>${esc(state.answers[i] || "")}</textarea>
      <p class="small" id="taskfb"></p></div>`;
  }
  html += `<div class="card check"><span class="tag">בדיקה</span><div id="qs"></div></div>
    <div id="adapt"></div>
    <button class="primary" id="next" disabled>${i === STEPS.length - 1 ? "סיימתי את המסלול" : "המשיכו לצעד " + (i + 2)}</button>
    </div>
    ${i > 0 ? `<button class="ghost" id="back" style="margin-top:8px;width:100%">חזרה לצעד ${i}</button>` : ""}`;
  app.innerHTML = html;
  if (locked) {
    document.querySelectorAll("#guessopts button").forEach(b => b.onclick = () => {
      state.guess[i] = Number(b.dataset.oi); save(); renderStep();
    });
  }

  const qs = document.getElementById("qs");
  s.check.forEach((q, qi) => qs.appendChild(buildQ(i, q, qi)));

  if (s.task) {
    const ta = document.getElementById("task");
    ta.oninput = () => { state.answers[i] = ta.value; save(); updateNext(); };
  }
  document.getElementById("next").onclick = () => {
    addTime();
    if (i < STEPS.length - 1) { state.step++; } else { state.screen = "challenge"; }
    render();
  };
  const back = document.getElementById("back");
  if (back) back.onclick = () => { addTime(); state.step--; render(); };
  updateNext();
}

function key(i, qi) { return i + "." + qi; }

function updateNext() {
  const i = state.step, s = STEPS[i];
  const allSolved = s.check.every((q, qi) => state.solved[key(i, qi)]);
  let taskOk = true;
  if (s.task) {
    const len = (state.answers[i] || "").trim().length;
    taskOk = len >= s.task.min;
    const fb = document.getElementById("taskfb");
    fb.textContent = taskOk ? "✓ המשימה מוכנה." : "כתבו עוד קצת כדי להמשיך.";
  }
  let adaptOk = true;
  if (allSolved && s.deep) {
    renderAdapt(i, s);
    const min = state.level[i] === "deep" ? 30 : 15;
    adaptOk = (state.adapt[i] || "").trim().length >= min;
  }
  const btn = document.getElementById("next");
  btn.disabled = !(allSolved && taskOk && adaptOk);
}

// Level: first-try success rate in this step and the previous one (>= 80% -> deep question)
function decideLevel(i) {
  if (state.level[i]) return state.level[i];
  let first = 0, total = 0;
  Object.keys(state.solved).forEach(k => {
    const [si, qi] = k.split(".").map(Number);
    if (si > i || si < i - 1 || !state.attempts[k]) return;
    total++; if (state.attempts[k] === 1) first++;
  });
  state.level[i] = total && first / total >= 0.8 ? "deep" : "basic";
  save();
  return state.level[i];
}

function renderAdapt(i, s) {
  const box = document.getElementById("adapt");
  if (box.dataset.done) return;
  box.dataset.done = "1";
  const deep = decideLevel(i) === "deep";
  box.innerHTML = `<div class="card check"><span class="tag">${deep ? "שאלת עומק" : "שאלת חשיבה"}</span>
    <p class="small">${deep ? "עניתם מצוין על הבדיקות, אז הנה שאלה קשה יותר. אין כאן תשובה אחת נכונה. חשוב שתנמקו." : "עוד שאלה אחת, כדי לוודא שהרעיון ברור."}</p>
    <label class="lbl" for="adaptta">${esc(deep ? s.deep : s.scaffold)}</label>
    <textarea id="adaptta">${esc(state.adapt[i] || "")}</textarea>
    <p class="small" id="adaptfb"></p></div>`;
  const ta = document.getElementById("adaptta");
  ta.oninput = () => {
    state.adapt[i] = ta.value; save();
    const min = deep ? 30 : 15;
    document.getElementById("adaptfb").textContent = ta.value.trim().length >= min ? "✓ מוכן." : (deep ? "נמקו קצת יותר: למה? איך אתם יודעים?" : "כתבו עוד קצת כדי להמשיך.");
    updateNext();
  };
}

function buildQ(i, q, qi) {
  const k = key(i, qi);
  const box = document.createElement("div");
  box.className = "q";
  box.innerHTML = `<div class="qt">${esc(q.q)}</div>`;
  const fb = document.createElement("div");
  fb.className = "fb";
  fb.setAttribute("role", "status");

  if (q.type === "mcq") {
    const opts = document.createElement("div");
    opts.className = "opts";
    q.options.forEach((o, oi) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = o;
      if (state.solved[k] && oi === q.correct) b.classList.add("right");
      b.onclick = () => {
        if (state.solved[k]) return;
        state.attempts[k] = (state.attempts[k] || 0) + 1;
        if (oi === q.correct) {
          state.solved[k] = true; b.classList.add("right");
          fb.className = "fb ok"; fb.textContent = "✓ נכון!";
        } else {
          b.classList.add("wrong");
          fb.className = "fb bad"; fb.textContent = "עוד לא. רמז: " + q.hint;
        }
        save(); updateNext();
      };
      opts.appendChild(b);
    });
    box.appendChild(opts);
    if (state.solved[k]) { fb.className = "fb ok"; fb.textContent = "✓ נכון!"; }
  }

  if (q.type === "order") {
    const shuffled = q.items.map((t, idx) => idx).sort(() => Math.random() - 0.5);
    let picked = [];
    const pickedBox = document.createElement("div"); pickedBox.className = "order-picked";
    const pool = document.createElement("div"); pool.className = "order-pool";
    const reset = document.createElement("button"); reset.type = "button"; reset.className = "ghost"; reset.textContent = "נקו ונסו שוב";
    reset.style.marginTop = "8px";
    function draw() {
      pickedBox.innerHTML = picked.length
        ? picked.map((idx, n) => `<div><span class="num">${n + 1}.</span>${esc(q.items[idx])}${state.solved[k] ? ` <span class="small">(${q.years[idx]})</span>` : ""}</div>`).join("")
        : `<span class="small">האירועים שתבחרו יופיעו כאן, לפי הסדר.</span>`;
      pool.innerHTML = "";
      shuffled.filter(idx => !picked.includes(idx)).forEach(idx => {
        const b = document.createElement("button"); b.type = "button"; b.textContent = q.items[idx];
        b.style.textAlign = "start"; b.style.borderColor = "var(--line)";
        b.onclick = () => { picked.push(idx); if (picked.length === q.items.length) judge(); draw(); };
        pool.appendChild(b);
      });
      reset.classList.toggle("hidden", !!state.solved[k]);
    }
    function judge() {
      state.attempts[k] = (state.attempts[k] || 0) + 1;
      if (picked.every((idx, n) => idx === n)) {
        state.solved[k] = true; fb.className = "fb ok"; fb.textContent = "✓ מצוין! זה הסדר הנכון.";
      } else {
        fb.className = "fb bad"; fb.textContent = "הסדר עוד לא נכון. רמז: " + q.hint + " לחצו \"נקו ונסו שוב\".";
      }
      save(); updateNext();
    }
    reset.onclick = () => { picked = []; fb.textContent = ""; draw(); };
    if (state.solved[k]) { picked = q.items.map((t, idx) => idx); fb.className = "fb ok"; fb.textContent = "✓ מצוין! זה הסדר הנכון."; }
    box.append(pickedBox, pool, reset);
    draw();
  }

  if (q.type === "selfcheck") {
    const list = document.createElement("div"); list.className = "checklist";
    const marks = state.answers[k] || q.items.map(() => false);
    q.items.forEach((t, ti) => {
      const id = "sc" + ti;
      const l = document.createElement("label");
      l.innerHTML = `<input type="checkbox" id="${id}" ${marks[ti] ? "checked" : ""}> ${esc(t)}`;
      l.querySelector("input").onchange = e => {
        marks[ti] = e.target.checked; state.answers[k] = marks;
        state.solved[k] = marks.every(Boolean); save(); updateNext();
      };
      list.appendChild(l);
    });
    box.appendChild(list);
  }

  box.appendChild(fb);
  return box;
}

    ${CHALLENGES.map((c, ci) => `<div class="card task"><span class="tag">${esc(c.title)}</span>
      <label class="lbl" for="ch${ci}">${esc(c.prompt)}</label>
      <textarea id="ch${ci}">${esc(state.challenges[ci] || "")}</textarea></div>`).join("")}

      <p>ב-Google Street View יש "מכונת זמן", שמראה איך נראה מקום לפני כמה שנים.</p>

      <p>2. גררו את האיש הצהוב אל הרחוב.</p>
      <p>3. בתיבה שבפינה העליונה לחצו על השעון, או על "תאריכים נוספים", ובחרו שנה ישנה.</p>
      <label class="lbl" for="game0">מה מצאתם? כתבו את שם המקום, מה השתנה, ומה המחיר של השינוי.</label>
      <textarea id="game0">${esc(state.games[0] || "")}</textarea>
      <p class="small">רוצים להראות לכיתה? צלמו מסך של "אז" ושל "עכשיו". אולי נציג אותם במעגל הסגירה.</p></div>
    <div class="card game"><span class="tag">משחק 2: הגודל האמיתי</span>
      <p>פתחו את <a class="ext" href="https://www.thetruesize.com" target="_blank" rel="noopener">The True Size</a>. כתבו שם של מדינה, וגררו אותה על המפה. שימו לב מה קורה לגודל שלה כשמזיזים אותה לקו המשווה ולקטבים.</p>
      <label class="lbl" for="game1">משימה: מצאו מדינה שנראית במפה גדולה מאפריקה, אבל היא באמת קטנה ממנה. איזו מדינה, ופי כמה היא קטנה?</label>
      <textarea id="game1">${esc(state.games[1] || "")}</textarea></div>
    <button class="primary" id="tofinish">עברו לשליחת העבודה לאסף</button>`;
  [0, 1].forEach(gi => { const t = document.getElementById("game" + gi); t.oninput = () => { state.games[gi] = t.value; save(); }; });
  CHALLENGES.forEach((c, ci) => {
    const ta = document.getElementById("ch" + ci);
    ta.oninput = () => { state.challenges[ci] = ta.value; save(); };
  });

function isDone() { return state.screen === "challenge" || state.screen === "finish" || state.step >= STEPS.length; }

function gmailUrl(subject, text) {
  return "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(TEACHER_EMAIL) +
    "&su=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(text);
}

function summary() {
  const partial = !isDone();
  const lines = [partial
    ? `עבודה חלקית: הגעתי לצעד ${state.step + 1} מתוך ${STEPS.length}. (העולם משתנה, ותל אביב-יפו איתו)`
    : "העבודה שלי: העולם משתנה, ותל אביב-יפו איתו", ""];
  let totalAttempts = 0, totalQs = 0, totalTime = 0;
  STEPS.forEach((s, i) => {
    if (partial && i > state.step) return;
    const t = state.times[i] || 0; totalTime += t;
    const att = s.check.filter(q => q.type !== "selfcheck").map((q, qi) => state.attempts[key(i, qi)] || 0);
    totalAttempts += att.reduce((a, b) => a + b, 0); totalQs += att.length;
    lines.push(`צעד ${i + 1} – ${s.title} (${Math.max(1, Math.round(t / 60))} דק', ניסיונות בבדיקה: ${att.join(", ") || "-"})`);
    if (s.task && state.answers[i]) lines.push("תשובה: " + state.answers[i].trim());
    if (state.adapt[i]) lines.push((state.level[i] === "deep" ? "שאלת עומק: " : "שאלת חשיבה: ") + state.adapt[i].trim());
    lines.push("");
  });
  CHALLENGES.forEach((c, ci) => {
    if ((state.challenges[ci] || "").trim()) { lines.push(c.title + ":", state.challenges[ci].trim(), ""); }
  });
  const GNAMES = ["בלשי זמן", "הגודל האמיתי"];
  [0, 1].forEach(gi => { if ((state.games[gi] || "").trim()) lines.push(GNAMES[gi] + ":", state.games[gi].trim(), ""); });
  const guessed = STEPS.filter((st, i) => st.guess && state.guess[i] === st.guess.correct).length;
  lines.push(`חידות: ניחשתי נכון ${guessed} מתוך ${STEPS.length}.`);
  lines.push(`סה"כ: ${Math.round(totalTime / 60)} דקות, ${totalAttempts} ניסיונות ל-${totalQs} שאלות.`);
  return lines.join("\n");
}

function renderFinish() {
  header("שליחה לאסף", 1);
  const text = summary();
  const url = gmailUrl("גיאוגרפיה ז6 – העולם משתנה", text);
  app.innerHTML = `<h1>שלחו לאסף את העבודה</h1>
    <div class="card task"><span class="tag">שלב אחרון</span>
      <p>1. לחצו על הכפתור. ייפתח מייל מוכן בחשבון Gmail של בית הספר.</p>
      <p>2. בדקו שהמייל נשלח מהחשבון שלכם, ולחצו "שליחה".</p>
      <a class="linkbtn" href="${url}" target="_blank" rel="noopener">פתחו מייל מוכן לאסף</a>
      <p class="small" style="margin-top:10px">המייל לא נפתח? לחצו "העתיקו", פתחו Gmail, והדביקו במייל חדש אל ${TEACHER_EMAIL}.</p>
      <div class="row"><button type="button" id="copy">העתיקו את העבודה</button></div>
      <p class="fb" id="copyfb" role="status"></p>
    </div>
    <div class="card explain"><span class="tag">מה נשלח</span><pre class="summary">${esc(text)}</pre></div>
    <div class="card"><p class="small">אחרי ששלחתם: לחצו כאן כדי לנקות את העבודה מהמחשב, בשביל התלמיד הבא.</p>
      <button class="ghost" id="clear" type="button">שלחתי. נקו את המחשב</button></div>
    <button class="ghost" id="backch" type="button" style="width:100%;margin-top:8px">חזרה לאתגרים</button>`;
  document.getElementById("copy").onclick = async () => {
    const fb = document.getElementById("copyfb");
    try { await navigator.clipboard.writeText(text); fb.className = "fb ok"; fb.textContent = "✓ הועתק. עכשיו הדביקו במייל."; }
    catch (e) { fb.className = "fb bad"; fb.textContent = "ההעתקה לא עבדה. סמנו את הטקסט בתיבה \"מה נשלח\" והעתיקו ידנית (Ctrl+C)."; }
  };
  document.getElementById("clear").onclick = () => {
    if (confirm("למחוק את העבודה מהמחשב הזה? ודאו שהמייל נשלח.")) { state = fresh(); try { localStorage.removeItem(STORE_KEY); } catch (e) {} render(); }
  };
  document.getElementById("backch").onclick = () => { state.screen = "challenge"; render(); };
}

render();
</script>
